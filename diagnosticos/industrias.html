<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico de Eficiência Operacional — Indústrias</title><style>:root{font-family:Inter,system-ui,Arial,sans-serif;color:#18181b;background:#f7f7f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:860px;margin:auto;padding:26px 16px 60px}.card{background:#fff;border:1px solid #e4e4e7;border-radius:18px;box-shadow:0 12px 36px #0000000d;overflow:hidden}.hero{padding:30px;border-bottom:1px solid #eee}.badge{display:inline-block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:#f1f5f9;padding:7px 10px;border-radius:999px}.hero h1{font-size:30px;line-height:1.15;margin:16px 0 10px}.hero p{color:#52525b;line-height:1.55;margin:0}.progress{height:6px;background:#eee}.bar{height:100%;background:#18181b;width:16.7%;transition:.25s}.step{padding:28px;display:none}.step.active{display:block}.step h2{margin:0 0 22px;font-size:22px}.q{margin-bottom:21px}.title{display:block;font-weight:650;margin-bottom:9px}.req:after{content:' *';color:#dc2626}input[type=text],input[type=email],input[type=tel],textarea,select{width:100%;padding:12px 13px;border:1px solid #d4d4d8;border-radius:10px;background:#fff;font:inherit}textarea{min-height:96px;resize:vertical}.opts{display:grid;gap:8px}.opt{display:flex;gap:9px;padding:10px 12px;border:1px solid #e4e4e7;border-radius:10px;background:#fafafa;align-items:flex-start}.opt input{margin-top:3px}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:28px}.btn{border:0;border-radius:10px;padding:12px 17px;font-weight:750;cursor:pointer}.secondary{background:#f4f4f5}.primary{background:#18181b;color:#fff;margin-left:auto}.status{text-align:center;padding:55px 28px}.foot{text-align:center;color:#71717a;font-size:12px;margin-top:14px}@media(max-width:600px){.hero,.step{padding:22px}.hero h1{font-size:25px}}</style></head><body><div class="wrap"><div clas let cur=0;const root=document.getElementById('steps');function esc(x){return x.replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function field(f){const[n,l,t,o,r]=f,cl=r?'title req':'title';if(t==='textarea')return `<div class="q"><label class="${cl}" for="${n}">${l}</label><textarea id="${n}" name="${n}" ${r?'required':''}></textarea></div>`;if(t==='select')return `<div class="q"><label class="${cl}" for="${n}">${l}</label><select id="${n}" name="${n}" ${r?'required':''}><option value="">Selecione</option>${o.map(v=>`<option>${esc(v)}</option>`).join('')}</select></div>`;if(t==='check')return `<div class="q"><label class="${cl}">${l}</label><div class="opts">${o.map(v=>`<label class="opt"><input type="checkbox" name="${n}" value="${esc(v)}">${esc(v)}</label>`).join('')}</div></div>`;return `<div class="q"><label class="${cl}" for="${n}">${l}</label><input id="${n}" name="${n}" type="${t}" ${r?'required':''}></div>`}root.innerHTML=S.map((s,i)=>`<section class="step ${i===0?'active':''}" data-i="${i}"><h2>${s[0]}</h2>${s[1].map(field).join('')}<div class="actions">${i?'<button type="button" class="btn secondary" onclick="prev()">Voltar</button>':''}${i<S.length-1?'<button type="button" class="btn primary" onclick="next()">Continuar</button>':'<button type="submit" class="btn primary">Enviar diagnóstico</button>'}</div></section>`).join('');function show(){document.querySelectorAll('.step').forEach((x,i)=>x.classList.toggle('active',i===cur));document.getElementById('bar').style.width=((cur+1)/S.length*100)+'%';window.scrollTo({top:0,behavior:'smooth'})}function valid(){for(const e of document.querySelectorAll(`.step[data-i="${cur}"] [required]`)){if(!e.checkValidity()){e.reportValidity();return false}}for(const f of S[cur][1])if(f[2]==='check'&&f[4]&&!document.querySelector(`input[name="${f[0]}"]:checked`)){alert('Preencha: '+f[1]);return false}return true}window.next=()=>{if(valid()){cur++;show()}};window.prev=()=>{cur--;show()};document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();if(!valid())return;if(document.getElementById('website').value)return;const d={};for(const s of S)for(const f of s[1]){const n=f[0];d[n]=f[2]==='check'?[...document.querySelectorAll(`input[name="${n}"]:checked`)].map(x=>x.value):(document.getElementById(n)?.value||'')}const row={form_type:'industria',company_name:d.nome_empresa,contact_name:d.responsavel,email:d.email,whatsapp:d.whatsapp,responses:d,user_agent:navigator.userAgent};const b=document.querySelector('button[type=submit]');b.disabled=true;b.textContent='Enviando...';try{const r=await fetch(U,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(row)});if(!r.ok)throw new Error();document.getElementById('card').innerHTML='<div class="status"><h1>Diagnóstico enviado com sucesso.</h1><p>Obrigado! Vamos analisar suas respostas para identificar os processos com maior potencial de automação, impacto financeiro e ganho de produtividade.</p></div>'}catch{b.disabled=false;b.textContent='Enviar diagnóstico';alert('Não foi possível enviar agora. Tente novamente.') }});</script></body></html>
