let cur=0;const root=document.getElementById('steps');function esc(x){return x.replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function field(f){const[n,l,t,o,r]=f,cl=r?'title req':'title';if(t==='textarea')return `<div class="q"><label class="${cl}" for="${n}">${l}</label><textarea id="${n}" name="${n}" ${r?'required':''}></textarea></div>`;if(t==='select')return `<div class="q"><label class="${cl}" for="${n}">${l}</label><select id="${n}" name="${n}" ${r?'required':''}><option value="">Selecione</option>${o.map(v=>`<option>${esc(v)}</option>`).join('')}</select></div>`;if(t==='check')return `<div class="q"><label class="${cl}">${l}</label><div class="opts">${o.map(v=>`<label class="opt"><input type="checkbox" name="${n}" value="${esc(v)}">${esc(v)}</label>`).join('')}</div></div>`;return `<div class="q"><label class="${cl}" for="${n}">${l}</label><input id="${n}" name="${n}" type="${t}" ${r?'required':''}></div>`}root.innerHTML=S.map((s,i)=>`<section class="step ${i===0?'active':''}" data-i="${i}"><h2>${s[0]}</h2>${s[1].map(field).join('')}<div class="actions">${i?'<button type="button" class="btn secondary" onclick="prev()">Voltar</button>':''}${i<S.length-1?'<button type="button" class="btn primary" onclick="next()">Continuar</button>':'<button type="submit" class="btn primary">Enviar diagnóstico</button>'}</div></section>`).join('');function show(){document.querySelectorAll('.step').forEach((x,i)=>x.classList.toggle('active',i===cur));document.getElementById('bar').style.width=((cur+1)/S.length*100)+'%';window.scrollTo({top:0,behavior:'smooth'})}function valid(){for(const e of document.querySelectorAll(`.step[data-i="${cur}"] [required]`)){if(!e.checkValidity()){e.reportValidity();return false}}for(const f of S[cur][1])if(f[2]==='check'&&f[4]&&!document.querySelector(`input[name="${f[0]}"]:checked`)){alert('Preencha: '+f[1]);return false}return true}window.next=()=>{if(valid()){cur++;show()}};window.prev=()=>{cur--;show()};document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();if(!valid())return;if(document.getElementById('website').value)return;const d={};for(const s of S)for(const f of s[1]){const n=f[0];d[n]=f[2]==='check'?[...document.querySelectorAll(`input[name="${n}"]:checked`)].map(x=>x.value):(document.getElementById(n)?.value||'')}const row={form_type:'contabilidade',company_name:d.nome_escritorio,contact_name:d.responsavel,email:d.email,whatsapp:d.whatsapp,responses:d,user_agent:navigator.userAgent};const b=document.querySelector('button[type=submit]');b.disabled=true;b.textContent='Enviando...';try{const r=await fetch(U,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(row)});if(!r.ok)throw new Error();document.getElementById('card').innerHTML='<div class="status"><h1>Diagnóstico enviado com sucesso.</h1><p>Obrigado! Vamos analisar suas respostas para identificar os processos com maior potencial de automação, impacto financeiro e ganho de produtividade.</p></div>'}catch{b.disabled=false;b.textContent='Enviar diagnóstico';alert('Não foi possível enviar agora. Tente novamente.') }});</script></body></html>
